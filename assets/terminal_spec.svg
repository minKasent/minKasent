<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1793d1"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <style>
      .bg { fill: #16161e; rx: 12px; }
      .bar { fill: #1a1b26; rx: 12px 12px 0 0; }
      .title { fill: #7aa2f7; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
      .prompt-user { fill: #bb9af7; font-weight: 700; }
      .prompt-at { fill: #565f89; }
      .prompt-host { fill: #7aa2f7; font-weight: 700; }
      .divider { fill: #414868; }
      .key { fill: #7dcfff; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
      .val { fill: #c0caf5; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 400; }
      .val-hl { fill: #9ece6a; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 500; }
      .val-accent { fill: #e0af68; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .palette-box { width: 22px; height: 14px; rx: 3px; }
      .arch-label { fill: #bb9af7; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
      .arch-div { fill: #565f89; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="360" class="bg" stroke="#2ac3de" stroke-width="1" stroke-opacity="0.25"/>
  <rect width="800" height="36" class="bar"/>

  <!-- Window Controls -->
  <circle cx="24" cy="18" r="6" fill="#f7768e"/>
  <circle cx="44" cy="18" r="6" fill="#e0af68"/>
  <circle cx="64" cy="18" r="6" fill="#9ece6a"/>

  <!-- Window Title -->
  <text x="400" y="23" text-anchor="middle" class="title">minKasent@Kasent-Arch: ~</text>

  <!-- Official Arch Linux Vector Logo (Pixel-perfect, never skews) -->
  <g transform="translate(65, 68)">
    <g transform="scale(0.293)">
      <path fill="url(#archGrad)" d="M256 1.6c-22.3 55.7-36.6 90.6-62 144.7 15.9 17.5 35 36.6 65.2 57.2-33.4-12.7-55.7-27-71.6-41.3C154.2 230.6 103.4 326 1.6 512c79.5-47.7 143.1-76.3 201.9-87.5-3.2-11.1-4.8-22.3-4.8-35V388c1.6-52.5 28.6-92.2 60.4-89 31.8 1.6 57.2 46.1 55.7 98.6l-3.2 27c57.2 11.1 119.3 41.3 198.8 85.9L467.5 431c-20.7-15.9-42.9-36.6-87.5-60.4 30.2 8 52.5 17.5 70 27C313.2 144.7 302.1 111.3 256 0z"/>
    </g>
    <text x="75" y="178" text-anchor="middle" class="arch-label">[ ARCH LINUX x86_64 ]</text>
    <text x="75" y="198" text-anchor="middle" class="arch-div">=====================</text>
  </g>

  <!-- System Information Details -->
  <g transform="translate(285, 75)">
    <!-- User@Host Prompt -->
    <text x="0" y="18" font-family="'Fira Code', 'Courier New', monospace" font-size="15">
      <tspan class="prompt-user">minKasent</tspan>
      <tspan class="prompt-at">@</tspan>
      <tspan class="prompt-host">Kasent-Arch</tspan>
    </text>
    <text x="0" y="32" class="divider">---------------------------------------------</text>

    <!-- Specs List -->
    <text x="0" y="55" class="key">User<tspan dx="58" class="val">: Dang Khoa (minKasent)</tspan></text>
    <text x="0" y="78" class="key">Role<tspan dx="58" class="val-hl">: Fullstack &amp; Mobile Architect</tspan></text>
    <text x="0" y="101" class="key">OS<tspan dx="74" class="val">Arch Linux x86_64 (Rolling)</tspan></text>
    <text x="0" y="124" class="key">Kernel<tspan dx="42" class="val">Clean-Architecture 6.1-LTS (Saga/DDD)</tspan></text>
    <text x="0" y="147" class="key">Shell<tspan dx="50" class="val">zsh 5.9 (Tokyo Night theme)</tspan></text>
    <text x="0" y="170" class="key">Editor<tspan dx="42" class="val">Neovim (Lua / LSP / Treesitter)</tspan></text>
    <text x="0" y="193" class="key">Backend<tspan dx="34" class="val-accent">Java 21, Spring Boot, Kafka, Next.js</tspan></text>
    <text x="0" y="216" class="key">Mobile<tspan dx="42" class="val-accent">Flutter, Dart, Clean BLoC, Android/iOS</tspan></text>
    <text x="0" y="239" class="key">Status<tspan dx="42" class="val-hl">● Active — Building High-Throughput Systems</tspan></text>

    <!-- Tokyo Night Color Palette Blocks -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" class="palette-box" fill="#15161e"/>
      <rect x="28" y="0" class="palette-box" fill="#f7768e"/>
      <rect x="56" y="0" class="palette-box" fill="#9ece6a"/>
      <rect x="84" y="0" class="palette-box" fill="#e0af68"/>
      <rect x="112" y="0" class="palette-box" fill="#7aa2f7"/>
      <rect x="140" y="0" class="palette-box" fill="#bb9af7"/>
      <rect x="168" y="0" class="palette-box" fill="#7dcfff"/>
      <rect x="196" y="0" class="palette-box" fill="#a9b1d6"/>
    </g>
  </g>
</svg>